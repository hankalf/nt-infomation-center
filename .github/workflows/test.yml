name: Tests

on:
  push:
  pull_request:

jobs:
  information-center:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  employee-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee-hub
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: employee-hub/package-lock.json
      - run: npm ci
      - run: npm test
