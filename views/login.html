<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/admin.css" />
</head>
<body class="login-page">
  <main class="login-card panel">
    <div class="login-brand">
      <span id="login-logo" class="brand-mark" aria-hidden="true">📦</span>
      <div>
        <h1 id="login-site">Information Center</h1>
        <p class="muted small">Sign in with the username and password you were given.</p>
      </div>
    </div>
    <p id="notice" class="notice" hidden></p>
    <p id="error" class="alert" hidden></p>
    <form method="post" action="/login">
      <input type="hidden" name="next" id="next" />
      <label>Username
        <input name="username" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="muted small">Forgotten your password or don't have a login? Ask your supervisor or an admin.</p>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var messages = {
        wrong: "That username or password isn't right. Please try again.",
        locked: "Too many attempts. Please wait 15 minutes and try again.",
        disabled: "This account has been disabled. Please speak to an admin.",
      };
      var code = q.get("error");
      if (code && messages[code]) {
        var el = document.getElementById("error");
        el.textContent = messages[code];
        el.hidden = false;
      }
      if (q.get("signedout")) {
        var n = document.getElementById("notice");
        n.textContent = "You've been signed out.";
        n.hidden = false;
      }
      document.getElementById("next").value = q.get("next") || "/";
      var u = document.getElementById("username");
      if (q.get("u")) { u.value = q.get("u"); document.querySelector('[name="password"]').focus(); } else { u.focus(); }

      fetch("/api/public-info").then(function (r) { return r.json(); }).then(function (info) {
        document.title = "Sign in · " + info.siteName;
        document.getElementById("login-site").textContent = info.siteName;
        if (info.logo) {
          var img = document.createElement("img");
          img.className = "brand-logo";
          img.alt = "";
          img.src = "/files/" + encodeURIComponent(info.logo);
          var box = document.getElementById("login-logo");
          box.textContent = "";
          box.appendChild(img);
        }
      }).catch(function () {});
    })();
  </script>
</body>
</html>
